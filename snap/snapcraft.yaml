name: floci-az
base: core26
version: '0.16.0'
title: Floci AZ
icon: snap/gui/floci-az.png
summary: A local Azure emulator for development and testing
description: |
  Floci AZ provides Azure-compatible APIs for local development, testing and
  CI, including Blob, Queue and Table Storage, Cosmos DB, Key Vault, App
  Configuration, Entra ID and Resource Manager. Point your Azure SDK, CLI or
  infrastructure tools at http://127.0.0.1:4577.

  The service starts on localhost and persists its state across restarts.
  Docker-backed services, including Functions, Event Hubs and the web
  console, require a separately installed Docker Engine and a manual
  interface connection. This is a development emulator; its APIs are not an
  authenticated service.
license: MIT
grade: stable
confinement: strict
website: https://floci.io/floci-az/
source-code:
  - https://github.com/floci-io/floci-az
  - https://github.com/sidalit/floci-az-snap
issues:
  - https://github.com/floci-io/floci-az/issues
  - https://github.com/sidalit/floci-az-snap/issues
contact: https://github.com/sidalit/floci-az-snap/issues

platforms:
  amd64:
  arm64:

apps:
  floci-az:
    command: bin/floci-az-launch
    plugs:
      - home
      - network
      - network-bind
      - docker
      - removable-media

  daemon:
    command: bin/floci-az-daemon
    daemon: simple
    restart-condition: on-failure
    stop-timeout: 60s
    plugs:
      - network
      - network-bind
      - docker

# Debian's JRE configuration contains absolute links into this directory.
layout:
  /etc/java-25-openjdk:
    bind: $SNAP/etc/java-25-openjdk

parts:
  floci-az:
    plugin: nil
    source: https://github.com/floci-io/floci-az.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    source-depth: 1
    build-packages:
      - curl
      - openjdk-25-jdk-headless
      - unzip
    build-attributes: [enable-patchelf]
    stage-slices:
      - openjdk-25-jre-headless_standard
    override-build: |
      export JAVA_HOME="/usr/lib/jvm/java-25-openjdk-${CRAFT_ARCH_BUILD_FOR}"
      export PATH="$JAVA_HOME/bin:$PATH"
      ./mvnw --batch-mode package -DskipTests
      install -d "$CRAFT_PART_INSTALL/lib/floci-az"
      cp -a target/quarkus-app/. "$CRAFT_PART_INSTALL/lib/floci-az/"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/floci-az/LICENSE"

      # Include the trust store generated by the build environment's JRE.
      cp --remove-destination /etc/ssl/certs/java/cacerts \
        "$CRAFT_PART_INSTALL/usr/lib/jvm/java-25-openjdk-${CRAFT_ARCH_BUILD_FOR}/lib/security/cacerts"

  scripts:
    plugin: dump
    source: snap/local
